name: Docs

# Builds the site from a pull request with no secrets. The static output is
# handed to the "Docs preview" workflow as an artifact; nothing from the pull
# request runs with Cloudflare credentials.
on:
  pull_request:
    paths:
      - docs/**
      - examples/**
      - packages/*/README.md
      - packages/durability/src/**
      - packages/durability/tests/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yaml

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter durability-docs build

      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 1
