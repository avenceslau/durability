name: Packed artifact smoke (latest toolchain)

# Advisory early-warning signal: runs the packed-artifact gate against the latest
# Vitest pool, Wrangler, and workers-types releases. It is non-blocking so an
# upstream release cannot break normal CI, but surfaces forward incompatibility
# before it reaches a pinned bump.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-consumer-latest:
    name: Packed artifact smoke (latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Packed artifact smoke test (latest toolchain)
        env:
          PACK_CONSUMER_CHANNEL: latest
        run: pnpm pack:consumer
