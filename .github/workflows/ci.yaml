name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: pnpm format:check
          - name: Lint
            command: pnpm lint
          - name: Build
            command: pnpm build
          - name: Typecheck
            command: pnpm typecheck
          - name: Test
            command: pnpm test
          - name: Package validation
            command: pnpm pack:check
            build: true
          - name: Docs browser checks
            command: pnpm --filter durability-docs test:browser
            build: true
            browser: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs browser
        if: matrix.browser == true
        run: pnpm --filter durability-docs exec playwright install --with-deps chromium

      # Tests and typechecks build their dependencies through Turbo. Publint and
      # the docs browser checks need build output explicitly on their own runner.
      - name: Build packages for validation
        if: matrix.build == true
        run: pnpm build

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
